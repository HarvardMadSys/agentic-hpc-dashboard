[project]
name = "rc-dashboard"
version = "0.1.0"
description = "Live agent-behaviour dashboard over the ebpfm collector"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "orjson>=3.13.0",
    # the history store: sealed day-files as Parquet (history.py, feedparquet.py)
    "pyarrow>=15",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
rc-dashboard = "rc_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel is the package, and beside its code what an install without a checkout
# needs: the risk profiles (risk.profile names them as risk-profiles/<name>.json),
# and the built page when web/dist has been built (`npm run build`), which the
# default server.static_dir then finds inside the package (config._static_default).
# web/dist is gitignored, so it is listed as an artifact; absent, the wheel has no page.
# A build stamp, rc_dashboard/BUILD.json, goes in when a build writes one (about.py).
[tool.hatch.build.targets.wheel]
only-include = ["rc_dashboard", "risk-profiles", "web/dist"]
artifacts = ["web/dist/**"]

[tool.hatch.build.targets.wheel.sources]
"risk-profiles" = "rc_dashboard/risk-profiles"
"web/dist" = "rc_dashboard/web"
