[project]
name = "rc-dashboard"
version = "0.1.0"
description = "Live agent-behaviour dashboard over the ebpfm collector"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "orjson>=3.13.0",
    "uvicorn[standard]>=0.32",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# rc_dashboard.feedparquet: the feed as Parquet tables (docs/feed-parquet). The
# service never imports it.
parquet = ["pyarrow>=15"]

[project.scripts]
rc-dashboard = "rc_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rc_dashboard"]
