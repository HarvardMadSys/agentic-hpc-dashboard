<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Behaviour Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:root{
  /* Harvard identity palette, light only.  Crimson PMS 1807C #A51C30 is the accent and
     the agent series colour; the core palette supplies the neutral field it sits on.
     Series are brand hues re-stepped for this surface so the eight-slot set clears the
     lightness-band, chroma-floor and colour-vision gates (worst adjacent CVD dE 9.6). */
  color-scheme: light;
  --crimson:#A51C30; --crimson-ink:#8a1728; --crimson-wash:#f7e9eb;
  --page:#f7f4f4; --surface:#fdfbfb; --surface-2:#f2eeee; --sunken:#eae4e4;
  --ink:#1e1e1e; --ink-2:#4e4548; --muted:#8a7d80; --rule:#e4dcdc; --edge:#cfc4c5;
  --s1:#A51C30; --s2:#2f6cb0; --s3:#4d8f1f; --s4:#6f4aa0;
  --s5:#1b8f6a; --s6:#c98a00; --s7:#d2607d; --s8:#3aa0d0; --sg:#93a1ad;
  --good:#2f8f2c; --warn:#fcb315; --serious:#ec8f9c; --crit:#ed1b34;
  --seq1:#f0d4d9; --seq2:#d99aa5; --seq3:#c4707f; --seq4:#A51C30;
  --live:#4db848;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono,code,th,.tick,.val,.chip,.eyebrow{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--crimson-ink)}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}

/* ------------------------------------------------------------------ shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--rule);
  padding:20px 0 28px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.brand{padding:0 18px 18px;border-bottom:1px solid var(--rule)}
.brand .mark{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;font-size:15px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--crimson);flex:none;
  box-shadow:0 0 0 3px rgba(165,28,48,.18)}
.brand .sub{margin-top:6px;font-size:11px;color:var(--muted);letter-spacing:.02em}
nav{display:flex;flex-direction:column;padding:12px 10px;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  gap:8px;padding:8px 10px;border-radius:5px;font-size:13px;color:var(--ink-2)}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-selected="true"]{background:var(--sunken);color:var(--ink);font-weight:600;
  box-shadow:inset 2px 0 0 var(--crimson)}
nav .n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
.rail .foot{padding:14px 18px 0;margin-top:10px;border-top:1px solid var(--rule);
  font-size:11px;color:var(--muted);line-height:1.6}

main{padding:22px 26px 70px;max-width:1560px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.head h1{font-size:23px;font-weight:600;letter-spacing:-.015em}
.head p{margin:5px 0 0;color:var(--ink-2);max-width:66ch;font-size:13px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* ------------------------------------------------------------ class filter */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border:1px solid var(--edge);border-radius:99px;font-size:11px;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:currentColor;background:var(--surface);color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.5}
.chip .sw{width:9px;height:9px;border-radius:2px;flex:none}

/* -------------------------------------------------------------- panel grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(520px,1fr))}
.span2{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 15px 15px;
  min-width:0;display:flex;flex-direction:column;gap:10px}
.panel > header{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.panel h3{font-size:14px;font-weight:600;letter-spacing:-.005em}
.panel .why{font-size:12px;color:var(--ink-2);margin:2px 0 0}
.panel .src{font-size:10px;color:var(--muted);margin-top:3px;font-family:"IBM Plex Mono",monospace}

/* -------------------------------------------------------------- stat plates */
.plates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:1040px){.plates{grid-template-columns:repeat(4,minmax(0,1fr))}}
.plate{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:13px 14px;
  position:relative;overflow:hidden;display:flex;flex-direction:column}
.plate .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.plate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,var(--s1))}
.plate .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  font-family:"IBM Plex Mono",monospace}
.plate .v{font-size:29px;font-weight:600;letter-spacing:-.02em;margin-top:5px;line-height:1.05}
.plate .v small{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.plate .n{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.plate .tag{flex:none}

/* -------------------------------------------------------------- primitives */
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
svg{display:block;max-width:100%;height:auto;overflow:hidden}
.axis text,.tick{font-size:10px;fill:var(--muted)}
.axlbl{font-size:10px;fill:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.vlbl{font-size:10.5px;fill:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.grid-line{stroke:var(--rule);stroke-width:1}
.base-line{stroke:var(--edge);stroke-width:1}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:500;padding:0 10px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);color:var(--ink-2);vertical-align:top}
td.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
td .cmd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink);word-break:break-all}
tr:last-child td{border-bottom:none}
.sev{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;
  font-family:"IBM Plex Mono",monospace;border:1px solid var(--edge)}
.sev.HIGH{border-color:var(--crit);color:var(--crit);font-weight:600}
.sev.med{border-color:var(--serious);color:#a8515f}
.sev.low{color:var(--muted)}
.note{font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--edge);padding-left:9px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px}
.kv dt{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px}
.kv dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .08s;z-index:50;
  background:var(--ink);color:var(--page);padding:6px 9px;border-radius:4px;font-size:11px;
  font-family:"IBM Plex Mono",monospace;line-height:1.45;max-width:330px;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 7px;border-radius:99px;border:1px solid var(--edge);
  color:var(--ink-2);font-family:"IBM Plex Mono",monospace;flex:none;white-space:nowrap}
.pill .ld{width:6px;height:6px;border-radius:50%;background:var(--live);flex:none;
  animation:beat 2.4s ease-in-out infinite}
.pill.stale{border-color:var(--warn);color:#8a6410}
.pill.stale .ld{background:var(--warn);animation:none}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:11px;
  color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.status b{color:var(--ink);font-weight:500}
.refresh{all:unset;cursor:pointer;padding:3px 8px;border:1px solid var(--edge);border-radius:4px;
  font-size:10.5px;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
.refresh:hover{border-color:var(--crimson);color:var(--crimson-ink)}
.stream{max-height:420px;overflow-y:auto;overflow-x:auto}
.stream table{font-size:11.5px}
.stream td{padding:4px 9px 4px 0;white-space:nowrap}
.stream td.arg{white-space:nowrap;max-width:430px;overflow:hidden;text-overflow:ellipsis}
.stream tr.fresh{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--crimson-wash)}to{background:transparent}}
.dot{width:7px;height:7px;border-radius:2px;display:inline-block;flex:none}
.hidden{display:none!important}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
  nav{flex-direction:row;flex-wrap:wrap}
  main{padding:18px 14px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

function fmt(n, d){
  if (n==null || isNaN(n)) return "\u2014";
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(d??2)+"B";
  if (a >= 1e6) return (n/1e6).toFixed(d??2)+"M";
  if (a >= 1e4) return Math.round(n/1e3)+"k";
  if (a >= 100) return Math.round(n).toLocaleString();
  if (a >= 10)  return n.toFixed(d??1);
  return n.toFixed(d??(a<1?2:1));
}

  if (s==null) return "\u2014";

  if (s < 90) return s.toFixed(s<10?1:0)+" s";
  if (s < 5400) return (s/60).toFixed(s<600?1:0)+" min";
  if (s < 172800) return (s/3600).toFixed(s<36000?1:0)+" h";

function yGrid(x0, x1, y, v, lbl){
  return `<line class="grid-line" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"></line>
          <text class="tick" x="${x0-6}" y="${y+3}" text-anchor="end">${esc(lbl)}</text>`;
}
function niceTicks(max, n){
  if (!(max > 0)) return [0, 1];
  const raw = max / (n||4), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s => s >= raw) || 10*mag;
  const out = []; for (let v=0; v<=max*1.0001; v+=step) out.push(v);
  if (out[out.length-1] < max) out.push(out[out.length-1]+step);
  return out;
}

/* horizontal bars: label | bar | value */
function hbars(items, o){
  o = o || {};
  const labelW = o.labelW || 132, valW = o.valW || 54, rowH = o.rowH || 22, gap = 5;
  const w = 100, plotW = 100 - 0, h = items.length * rowH + 6;
  const max = o.max || Math.max(...items.map(d => d.v), 1);
  const W = o.W || 560, bw = W - labelW - valW;
  let s = "";
  items.forEach((d, i) => {
    const y = i * rowH + 3, bh = rowH - gap;
    const len = Math.max(d.v > 0 ? 2 : 0, bw * d.v / max);
    s += `<text class="vlbl" x="${labelW-8}" y="${y+bh/2+3.5}" text-anchor="end"
             fill="var(--ink-2)">${esc(d.k)}</text>
          <rect x="${labelW}" y="${y}" width="${len}" height="${bh}" rx="2"
             fill="${d.c || o.color || "var(--s1)"}"${T(d.tip || (d.k+": "+fmt(d.v)+(o.unit?" "+o.unit:"")))}></rect>
          <text class="vlbl" x="${labelW+len+7}" y="${y+bh/2+3.5}">${esc(d.lbl != null ? d.lbl : fmt(d.v))}</text>`;
  });
  return svg(W, h, s);
}

/* grouped vertical bars, one y-axis only */
function groupBars(groups, series, o){
  o = o || {};
  const W = o.W || 560, H = o.H || 200, L = 44, R = 8, TOP = o.ylabel ? 20 : 10, B = 34;
  const pw = W - L - R, ph = H - TOP - B;
  const max = o.max || Math.max(...groups.flatMap(g => series.map(s => g.v[s.k] || 0)), 1);
  const ticks = niceTicks(max, 4), top = ticks[ticks.length-1];
  const y = v => TOP + ph - ph * v / top;
  let s = ticks.map(t => yGrid(L, W-R, y(t), t, o.tickFmt ? o.tickFmt(t) : fmt(t))).join("");
  const gw = pw / groups.length, bw = Math.min(o.maxBar || 34, (gw - 14) / series.length);
  groups.forEach((g, gi) => {
    const x0 = L + gi*gw + (gw - bw*series.length - 2*(series.length-1))/2;
    series.forEach((se, si) => {
      const v = g.v[se.k] || 0, x = x0 + si*(bw+2), h = Math.max(v>0?1.5:0, y(0)-y(v));
      s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${h}" rx="2" fill="${se.c}"
              ${T(`${g.k} \u00b7 ${se.lbl}: ${o.fmt ? o.fmt(v) : fmt(v)}`)}></rect>`;
      if (o.labelTop && v > 0)
        s += `<text class="vlbl" x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle">${o.fmt?o.fmt(v):fmt(v)}</text>`;
    });
    s += `<text class="tick" x="${L+gi*gw+gw/2}" y="${TOP+ph+15}" text-anchor="middle">${esc(g.k)}</text>`;
    if (g.k2) s += `<text class="tick" x="${L+gi*gw+gw/2}" y="${TOP+ph+27}" text-anchor="middle"
                      fill="var(--muted)">${esc(g.k2)}</text>`;
  });
  s += `<line class="base-line" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"></line>`;
  if (o.ylabel) s += `<text class="axlbl" x="0" y="9">${esc(o.ylabel)}</text>`;
  return svg(W, H, s);
}

/* one 100%-stacked row, 2px surface gaps, selective in-bar labels */
function stackRow(segs, o){
  o = o || {};
  const W = o.W || 560, H = o.H || 30, tot = segs.reduce((a,d)=>a+d.v,0) || 1;
  let x = 0, s = "";
  segs.forEach(d => {
    const w = (W) * d.v / tot;
    if (w <= 0) return;
    s += `<rect x="${x}" y="0" width="${Math.max(0,w-2)}" height="${H}" rx="1.5" fill="${d.c}"
            ${T(`${d.k}: ${fmt(d.v)} (${(100*d.v/tot).toFixed(1)}%)`)}></rect>`;
    if (w > 44) s += `<text x="${x+(w-2)/2}" y="${H/2+3.5}" text-anchor="middle"
            style="font-size:10.5px;font-family:'IBM Plex Mono',monospace;fill:var(--surface)"
            >${(100*d.v/tot).toFixed(w>62?1:0)}%</text>`;
    x += w;
  });
  return svg(W, H, s);
}

/* multi-line chart, optional log axes, hover dots */
function lines(series, o){
  o = o || {};
  const W = o.W || 560, H = o.H || 210, L = o.L || 48, R = 12,
        TOP = o.ylabel ? 22 : 12, B = 34;
  const pw = W - L - R, ph = H - TOP - B;
  const xs = series.flatMap(s => s.pts.map(p => p[0]));
  const ys = series.flatMap(s => s.pts.map(p => p[1]));
  const x0 = o.xmin != null ? o.xmin : Math.min(...xs), x1 = o.xmax != null ? o.xmax : Math.max(...xs);
  const y1 = o.ymax != null ? o.ymax : Math.max(...ys), y0 = o.ymin != null ? o.ymin : (o.ylog ? Math.min(...ys) : 0);
  const lx = v => o.xlog ? Math.log10(Math.max(v, x0 || 1e-9)) : v;
  const ly = v => o.ylog ? Math.log10(Math.max(v, y0 || 1e-9)) : v;
  const X = v => L + pw * (lx(v)-lx(x0)) / ((lx(x1)-lx(x0)) || 1);
  const Y = v => TOP + ph - ph * (ly(v)-ly(y0)) / ((ly(y1)-ly(y0)) || 1);
  let s = "";
  const yt = o.ylog ? logTicks(y0, y1) : niceTicks(y1, 4).filter(t => t >= y0);
  yt.forEach(t => s += yGrid(L, W-R, Y(t), t, o.yfmt ? o.yfmt(t) : fmt(t)));
  const xt = o.xticks || (o.xlog ? logTicks(x0, x1) : niceTicks(x1, 5).filter(t => t >= x0));
  xt.forEach(t => s += `<text class="tick" x="${X(t)}" y="${TOP+ph+15}" text-anchor="middle"
      >${esc(o.xfmt ? o.xfmt(t) : fmt(t))}</text>`);
  series.forEach(se => {
    const d = se.pts.map((p,i) => (i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
    if (se.area){
      s += `<path d="${d} L ${X(se.pts[se.pts.length-1][0]).toFixed(1)} ${Y(y0)} L ${X(se.pts[0][0]).toFixed(1)} ${Y(y0)} Z"
              fill="${se.c}" opacity=".1"></path>`;
    }
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            ${se.step ? 'shape-rendering="crispEdges"' : ""}></path>`;
    const every = Math.max(1, Math.round(se.pts.length / 26));
    se.pts.forEach((p, i) => {
      if (i % every) return;
      s += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="8" fill="transparent"
              ${T(`${se.lbl} \u00b7 ${o.xname||"x"} ${o.xfmt?o.xfmt(p[0]):fmt(p[0])} \u2192 ${o.yname||"y"} ${o.yfmt?o.yfmt(p[1]):fmt(p[1])}`)}></circle>`;
    });
    if (se.mark){
      const p = se.pts[se.pts.length-1];
      s += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.5" fill="${se.c}"
              stroke="var(--surface)" stroke-width="2"></circle>
            <text class="vlbl" x="${X(p[0])-6}" y="${Y(p[1])-9}" text-anchor="end">${esc(se.mark)}</text>`;
    }
  });
  s += `<line class="base-line" x1="${L}" x2="${W-R}" y1="${Y(y0)}" y2="${Y(y0)}"></line>`;
  if (o.ylabel) s += `<text class="axlbl" x="0" y="9">${esc(o.ylabel)}</text>`;
  if (o.xlabel) s += `<text class="axlbl" x="${W-R}" y="${H-4}" text-anchor="end">${esc(o.xlabel)}</text>`;
  return svg(W, H, s);
}
function logTicks(a, b){
  const out = [];
  for (let e = Math.floor(Math.log10(Math.max(a, 1e-9))); e <= Math.ceil(Math.log10(b)); e++){
    const v = Math.pow(10, e);
    if (v >= a*0.999 && v <= b*1.001) out.push(v);
  }
  return out.length ? out : [a, b];
}

      <div class="n">${fint(n.pending_agent_jobs)} pending \u00b7 ${fint(n.agent_gpu_jobs)} holding GPUs</div>
    </div>
    <div class="plate" style="--stripe:var(--crit)">
      <div class="k">GPUs held at zero utilisation</div>
      <div class="v">${fint(n.agent_gpu_idle_now)}</div>
      <div class="n">of ${fint(n.agent_gpu_jobs)} agent GPU jobs running right now</div>
    </div>
  </div>`;

  const hostRows = (L.hosts||[]).map(h =>
    `<tr><td class="mono">${esc(h.host)}</td>
      <td class="num">${fint(h.roots)}</td><td class="num">${fint(h.procs)}</td>
      <td class="num">${fmt(h.rss_gb)}</td><td class="num">${fmt(h.cpu_pct)}%</td>
      <td class="num">${fint(h.load_1)}</td>
      <td class="num">${h.d_state ? `<span style="color:var(--crit)">${h.d_state}</span>` : 0}</td>
      <td class="num">${fint(h.users)}</td><td class="num">${fint(h.tcp_open_ext)}</td></tr>`).join("");

  const evRows = (L.events||[]).slice(0, 60).map((e, i) =>
    `<tr class="${i < (state.freshCount||0) ? "fresh" : ""}">
      <td class="mono" style="color:var(--muted)">${esc(e.ts)}</td>
      <td class="mono" style="font-size:10px;color:var(--muted)"
          data-tip="${esc(CLS_LBL[e.actor3]||e.actor3)}${e.agent_type ? " \u00b7 "+e.agent_type : ""}"
          >${esc({"agent":"agt","human-vscode":"vsc","human":"hum"}[e.actor3] || "?")}</td>
      <td class="mono">${esc(e.user)}</td>
      <td class="mono" style="color:var(--muted)">${esc(e.host.replace("login",""))}</td>
      <td class="num">d${e.depth}</td>
      <td class="arg"><span class="cmd" style="color:${pcol(e.purpose)}">${esc(e.comm)}</span>
        <span style="color:var(--ink-2)"> ${esc(e.args.slice(e.comm.length))}</span></td>
      <td class="num">${dur(e.duration_s)}</td>
      <td class="num">${e.cpu_s < 0.01 ? "\u2014" : e.cpu_s.toFixed(2)+"s"}</td>
      <td class="num">${e.signal ? `<span style="color:var(--warn)">sig${e.signal}</span>`
        : (e.exit_code ? `<span style="color:var(--crit)">${e.exit_code}</span>` : "0")}</td></tr>`).join("");

  const subRows = (L.submits||[]).map(r =>
    `<tr><td class="mono" style="color:var(--muted)">${esc(r.ts)}</td>
      <td class="mono">${esc(r.user)}</td>
      <td class="mono" style="font-size:10.5px">${esc(r.agent_type||"\u2014")}</td>
      <td class="mono">${esc(r.tool)}</td>
      <td class="num">${r.job_id}</td>
      <td class="mono">${esc(r.partition)}</td>
      <td class="num">${r.gpus || "\u2014"}</td>
      <td class="mono">${esc(r.array || "\u2014")}</td></tr>`).join("");

  return plates + `<div class="grid wide">
    ${panel("live","Process exits per minute",
      rateSeries.length ? lines(rateSeries, {W:1060, H:220, ymin:0, xticks:xt,
        xfmt: i => (rate[i] ? rate[i].t : ""), ylabel:"exits / min",
        xlabel:"last 90 minutes", xname:"at", yname:"exits/min"}) +
        legend(rateSeries.map(x => ({k:x.lbl, c:x.c}))) : "",
      {live:true, span:true, why:"the agent line spikes on hook storms, not on submissions"})}
    ${panel("live","Login nodes right now",
      `<div class="scroller"><table>
        <tr><th>host</th><th>agent roots</th><th>procs</th><th>RSS GB</th><th>CPU</th>
          <th>load\u2081</th><th>D-state</th><th>users</th><th>ext TCP</th></tr>${hostRows}</table></div>
       `, {live:true, why:false})}
    ${panel("live","Recent sbatch / salloc from agent sessions",
      `<div class="scroller"><table>
        <tr><th>at</th><th>user</th><th>product</th><th>tool</th><th>job</th><th>partition</th>
          <th>gpu</th><th>array</th></tr>${subRows}</table></div>`,
      {live:true, why:"eBPF submit records, job id parsed from the tool's own stdout"})}
    ${panel("live","Process exit stream",
      `<div class="stream"><table>
        <tr><th>at</th><th>class</th><th>user</th><th>host</th><th>d</th><th>command</th>
          <th>ran</th><th>cpu</th><th>exit</th></tr>${evRows}</table></div>
       ${legend(PURP.map(x => ({k:x[1], c:x[2]})))}`,
      {live:true, span:true, why:"every process exit on the login nodes, coloured by purpose"})}
  </div>`;
}

/* ============================================================== OVERVIEW */
function tabOverview(){
  const f = P.fleet || {}, j = P.jobs || {}, g = P.gpu_duty || {}, id = P.identity || {};
  const jc = (j.classes || {});
  const ag = jc.agent || {}, ot = jc.other || {};
  const epd = f.events_per_day || {};
  const agentShareEvents = 100 * (epd.agent || 0) / (Object.values(epd).reduce((a,b)=>a+b,0) || 1);
  const gh = (g.hours || {});
  const ghTot = Object.values(gh).reduce((a,b)=>a+b,0) || 1;

  const plates = `<div class="plates">
    <div class="plate" style="--stripe:var(--s1)">
      <div class="k">agent process exits / day</div>
      <div class="v">${fmt(epd.agent)}</div>
      <div class="n">${pc(agentShareEvents)} of all login-node process exits \u00b7 ${fmt(f.per_user_exits_day ? f.per_user_exits_day.agent : null)}/user/day</div>
    </div>
    <div class="plate" style="--stripe:var(--s7)">
      <div class="k">resident agent roots</div>
      <div class="v">${fint((f.roots||{}).agent)}</div>
      <div class="n">median root age 7.5 d \u00b7 24\u201345% never exit before the fleet reboot</div>
    </div>
    <div class="plate" style="--stripe:var(--s8)">
      <div class="k">agent-attributed job failure</div>
      <div class="v">${pc((ag.state_pct||{}).FAILED)}</div>
      <div class="n">vs ${pc((ot.state_pct||{}).FAILED)} for everything else \u00b7 n=${fint(ag.jobs)} jobs, ${fint(ag.users)} users</div>
    </div>
    <div class="plate" style="--stripe:var(--s3)">
      <div class="k">agent share of GPU-hours</div>
      <div class="v">${pc(100*(gh.agent||0)/ghTot)}</div>
      <div class="n">but ${pc((g.sm_util_pct||{}).agent)} device utilisation vs ${pc((g.sm_util_pct||{}).human)} for humans</div>
    </div>
  </div>`;

  /* who is on the login nodes - three units, because the ranking flips */
  const st = f.standing || {};
  const unitRows = [
    {k:"process exits / day", get: c => epd[c]},
    {k:"standing instances", get: c => c==="agent" ? (st.claude_code||{}).instances + (st.codex||{}).instances + (st.cursor||{}).instances
                                     : c==="human-vscode" ? (st.vscode||{}).instances : (st.human||{}).instances},
    {k:"resident roots", get: c => (f.roots||{})[c]},
    {k:"CPU cores held", get: c => (f.cores||{})[c]},
    {k:"resident RSS (GB)", get: c => (f.rss_gb||{})[c]},
    {k:"distinct users", get: c => (f.users||{})[c]},
  ].filter(r => activeCls().some(c => r.get(c) != null));
  const footprint = unitRows.map(r => {
    const segs = activeCls().map(c => ({k:CLS_LBL[c], v:r.get(c)||0, c:CLS_COL[c]}));
    return `<div><div class="eyebrow" style="margin-bottom:4px">${esc(r.k)} \u00b7 ${
      activeCls().map(c => fmt(r.get(c))).join(" / ")}</div>${stackRow(segs, {H:18})}</div>`;
  }).join("");

  /* diurnal */
  const di = P.diurnal || {};
  const diSeries = activeCls().filter(c => di[c]).map(c => ({
    lbl: CLS_LBL[c], c: CLS_COL[c], mark: c === "agent" ? "agent" : null,
    pts: di[c].map((v,h) => [h, v])
  }));

  /* concentration */
  const cn = P.concentration || {};
  const cnSeries = ["agent","human"].filter(c => cn[c]).map(c => ({
    lbl: CLS_LBL[c] || c, c: CLS_COL[c],
    pts: cn[c].rank_size.map((v,i) => [i+1, Math.max(v, 0.0005)])
  }));

  return plates + `<div class="grid wide">
    ${panel("fleet","Who is on the login nodes", footprint +
      legend(activeCls().map(c => ({k:CLS_LBL[c], c:CLS_COL[c]}))) +
      ``,
      {span:true})}
    ${panel("diurnal","Day / night rhythm",
      diSeries.length ? lines(diSeries, {H:190, xmin:0, xmax:23, ymin:0,
        xticks:[0,4,8,12,16,20,23], xfmt: t => String(t).padStart(2,"0")+"h",
        yfmt: t => t.toFixed(1)+"%", ylabel:"% of that class's exits", xlabel:"hour of day (local)",
        xname:"hour", yname:"share"}) + legend(diSeries.map(s => ({k:s.lbl, c:s.c}))) +
        `` : "<p class='note'>no diurnal data</p>")}
    ${panel("concentration","Concentration: every aggregate is one user",
      cnSeries.length ? lines(cnSeries, {H:190, xlog:true, ylog:true, xmin:1,
        xfmt: t => "#"+fmt(t,0), yfmt: t => t<1 ? t.toFixed(2)+"%" : t.toFixed(0)+"%",
        ylabel:"share of class volume", xlabel:"user rank", xname:"rank", yname:"share"}) +
        `<dl class="kv">${["agent","human"].filter(c=>cn[c]).map(c =>
          `<dt>${esc(c)} gini</dt><dd>${cn[c].gini} \u00b7 top-1 ${pc(cn[c].top1_share_pct)} \u00b7 top-10 ${pc(cn[c].top10_share_pct)}</dd>`).join("")}
         <dt>measured (jobs)</dt><dd>gini ${((j.concentration||{}).gini_user_jobs)} over ${fint((j.concentration||{}).n_users)} users, top-10 ${pc((j.concentration||{}).top10_share_pct)}</dd></dl>`
      : "")}
    ${panel("identity","Identity layer",
      `<dl class="kv">
        <dt>users w/ assoc</dt><dd>${fint(id.n_users)}</dd>
        <dt>accounts (labs)</dt><dd>${fint(id.n_accounts)}</dd>
        <dt>QOS defined</dt><dd>${fint(id.n_qos)}</dd>
        <dt>assoc rows</dt><dd>${fint(id.n_assoc_rows)}</dd>
        <dt>admin levels</dt><dd>${Object.entries(id.admin_levels||{}).map(([k,v])=>k+" "+v).join(" \u00b7 ")}</dd>
        <dt>clusters</dt><dd>${(id.clusters||[]).map(c=>c.cluster+" (rpc "+c.rpc+")").join(", ")}</dd>
        <dt>federation</dt><dd>${id.federation_rows ? id.federation_rows+" rows" : "none \u2014 --federation is a no-op"}</dd>
        <dt>dumped</dt><dd>${esc(id.timestamp||"")} on ${esc(id.host||"")}</dd>
      </dl>`)}
  </div>`;
}

/* ============================================================== SESSIONS */
function tabSessions(){
  const pm = P.purpose_mix || {}, ss = P.session_sizes || {}, ar = P.archetypes || {};
  const dp = P.depth_profile || {}, ex = P.exit_status || {}, tc = P.top_commands || {};
  const gal = P.session_gallery || {};
  const cls = activeCls().filter(c => pm[c]);

  /* purpose: two charts, never one dual axis */
  const keys = PURP.map(p => p[0]);
  const mixFor = (c, field) => {
    const m = {}; (pm[c]||[]).forEach(r => { const k = keys.includes(r.purpose) ? r.purpose : "other";
      m[k] = (m[k]||0) + r[field]; });
    return m;
  };
  const purposeChart = field => {
    const groups = keys.map(k => ({k: PURP_SHORT[k], v: Object.fromEntries(
      cls.map(c => [c, mixFor(c, field)[k] || 0]))}));
    return groupBars(groups, cls.map(c => ({k:c, lbl:CLS_LBL[c], c:CLS_COL[c]})),
      {W:1060, H:230, maxBar:26, fmt: v => v.toFixed(1)+"%", tickFmt: t => t+"%",
       ylabel: field === "events_pct" ? "% of process exits" : "% of CPU seconds"});
  };

  /* session size CCDF */
  const ccdf = cls.filter(c => ss[c]).map(c => ({
    lbl: CLS_LBL[c], c: CLS_COL[c],
    pts: ss[c].ccdf.map(p => [p.x, p.ccdf])
  }));

  /* archetypes */
  const archKeys = ["ephemeral","poll-loop","env-churn","slurm-orchestrator","login-compute",
                    "ide-monitor","varied-activity","idle-resident","other"];
  const archCol = {"ephemeral":"var(--sg)","poll-loop":"var(--s8)","env-churn":"var(--s6)",
    "slurm-orchestrator":"var(--s5)","login-compute":"var(--s7)","ide-monitor":"var(--s4)",
    "varied-activity":"var(--s2)","idle-resident":"var(--s1)","other":"var(--edge)"};
  const archRows = activeCls().filter(c => ar[c]).map(c =>
    `<div><div class="eyebrow" style="margin-bottom:4px">${esc(CLS_LBL[c])}</div>
     ${stackRow(archKeys.map(k => ({k, v: ar[c][k]||0, c: archCol[k]})), {H:20})}</div>`).join("");

  /* depth */
  const depthRows = (dp.rows||[]).map(r => {
    const segs = Object.entries(r.purpose_pct||{}).sort((a,b)=>pord(a[0])-pord(b[0]))
      .map(([k,v]) => ({k: PURP_LBL[k]||k, v, c: pcol(k)}));
    return `<tr><td class="num">${r.depth}</td><td class="num">${pc(r.events_pct)}</td>
      <td class="num">${r.cpu_per_event_ms} ms</td>
      <td style="width:55%">${stackRow(segs, {W:320, H:13})}</td></tr>`;
  }).join("");

  /* exit status */
  const codes = (ex.codes||[]);
  const benign = codes.filter(c => c.benign !== false).reduce((a,c)=>a+c.n,0);
  const real = codes.filter(c => c.benign === false).reduce((a,c)=>a+c.n,0);
  const codeRows = codes.filter(c => c.exit_code !== 0).map(c =>
    `<tr><td class="mono">${c.signal ? "signal "+c.signal : "exit "+c.exit_code}</td>
      <td>${esc(c.label||"")}</td><td class="num">${fint(c.n)}</td>
      <td>${c.benign === false ? '<span class="sev med">real fault</span>'
                               : '<span class="sev low">benign</span>'}</td></tr>`).join("");

  /* top commands */
  const cmdBlocks = Object.entries(tc).filter(([k]) => !k.startsWith("_")).map(([k, rows]) => {
    if (k === "measured")
      return `<div><div class="eyebrow" style="margin:2px 0 5px">measured, all classes</div>
        ${hbars(rows.slice(0,12).map(r => ({k:r.comm, v:r.events_pct, c:"var(--s1)",
          lbl: r.events_pct.toFixed(1)+"% ev / "+r.cpu_pct.toFixed(1)+"% cpu",
          tip: r.comm+": "+r.events_pct+"% of exits, "+r.cpu_pct+"% of CPU"})), {labelW:150, valW:130})}</div>`;
    if (!activeCls().includes(k)) return "";
    return `<div><div class="eyebrow" style="margin:8px 0 5px">${esc(CLS_LBL[k]||k)}</div>
      ${hbars(rows.map(r => ({k:r[0], v:r[1], c:CLS_COL[k], lbl:r[1].toFixed(1)+"%"})),
        {labelW:230, valW:52, max: Math.max(...rows.map(r=>r[1]))})}</div>`;
  }).join("");

  /* gallery */
  const galRows = (gal.rows||[]).slice(0,14).map(r =>
    `<tr><td class="mono" style="white-space:nowrap">${esc(r.agent_type)}</td>
      <td class="mono" style="font-size:10.5px">${esc(r.archetype)}</td>
      <td class="num">${fint(r.n_events)}</td>
      <td class="num">${r.dom_frac}</td>
      <td>${ribbon(r.purpose_seq, {W:420, H:12})}</td>
      <td class="num">${dur(r.duration_s)}</td>
      <td>${r.autonomous ? '<span class="sev HIGH">bypass</span>' : ""}</td></tr>`).join("");

  return `<div class="grid wide">
    ${panel("purpose_mix","What the processes are for \u2014 counted, then costed",
      `<div class="eyebrow">share of process exits</div>${purposeChart("events_pct")}
       <div class="eyebrow" style="margin-top:6px">share of CPU seconds</div>${purposeChart("cpu_pct")}
       ${legend(cls.map(c => ({k:CLS_LBL[c], c:CLS_COL[c]})))}
       `,
      {span:true})}
    ${panel("session_sizes","How big is a session",
      ccdf.length ? lines(ccdf, {H:200, xlog:true, ylog:true, xmin:1,
        xfmt: t => fmt(t,0), yfmt: t => t >= 0.01 ? (100*t).toFixed(0)+"%" : (100*t).toFixed(2)+"%",
        ylabel:"P(events \u2265 x)", xlabel:"process exits in the session",
        xname:"events", yname:"P\u2265"}) + legend(ccdf.map(s => ({k:s.lbl, c:s.c}))) +
      `<div class="scroller"><table><tr><th>class</th><th>p50</th><th>p90</th><th>p99</th><th>max</th>
        <th>top 1% hold</th></tr>${cls.filter(c=>ss[c]).map(c => `<tr><td>${esc(CLS_LBL[c])}</td>
        <td class="num">${ss[c].p50}</td><td class="num">${ss[c].p90}</td>
        <td class="num">${fint(ss[c].p99)}</td><td class="num">${fint(ss[c].max)}</td>
        <td class="num">${pc(ss[c].share_events_top1pct)}</td></tr>`).join("")}</table></div>` : "")}
    ${panel("archetypes","What the session was doing", archRows +
      legend(archKeys.map(k => ({k, c: archCol[k]}))) +
      ``)}
    ${panel("depth_profile","Work migrates down the process tree",
      `<div class="scroller"><table><tr><th>depth</th><th>exits</th><th>CPU/event</th>
        <th>purpose mix</th></tr>${depthRows}</table></div>
       ${legend(PURP.map(p => ({k:p[1], c:p[2]})))}
       `)}
    ${panel("exit_status","How processes end",
      `<div class="eyebrow">benign non-zero vs real faults</div>
       ${stackRow([{k:"success + benign non-zero", v:benign, c:"var(--s3)"},
                   {k:"real faults", v:real, c:"var(--s8)"}], {H:20})}
       <div class="scroller"><table><tr><th>status</th><th>meaning</th><th>n</th><th></th></tr>
        ${codeRows}</table></div>
       
       `)}
    ${panel("top_commands","The head of the command distribution", cmdBlocks +
      ``)}
    ${panel("session_gallery","Session gallery \u2014 purpose over event sequence",
      `<div class="scroller"><table><tr><th>product</th><th>archetype</th><th>events</th>
        <th>dom</th><th>sequence \u2192</th><th>span</th><th></th></tr>${galRows}</table></div>
       ${legend(PURP.map(p => ({k:p[1], c:p[2]})))}
       `, {span:true})}
  </div>`;
}

/* ============================================================= RESIDENCY */
function tabResidency(){
  const lt = P.lifetime || {}, rs = P.residency_series || {}, bw = P.bwrap || {}, au = P.autonomy || {};
  const prods = Object.keys(lt).filter(k => !k.startsWith("_"));
  const pcolr = {"claude_code":"var(--s1)","codex":"var(--s2)","cursor":"var(--s3)",
                 "copilot":"var(--s4)","windsurf":"var(--s5)"};
  const km = prods.map(k => ({lbl:k, c:pcolr[k]||"var(--s7)",
    pts: lt[k].curve.map(p => [Math.max(p.t_h, 0.02), p.s]), step:true}));

  const rows = rs.rows || [];
  const sawtooth = rows.length ? lines([{lbl:"resident roots", c:"var(--s1)", area:true, mark:"roots",
    pts: rows.map(r => [r.day, r.roots])}], {H:180, ymin:0, xlabel:"day of era",
    ylabel:"live agent roots", xname:"day", yname:"roots"}) : "";
  const inert = rows.length ? lines([
    {lbl:"RSS per root (MB)", c:"var(--s2)", pts: rows.map(r => [r.day, r.rss_per_root_mb]), mark:"MB/root"}
  ], {H:150, ymin:0, xlabel:"day of era", ylabel:"MB per resident root", xname:"day", yname:"MB"}) : "";
  const inert2 = rows.length ? lines([
    {lbl:"CPU per root (%)", c:"var(--s7)", pts: rows.map(r => [r.day, r.cpu_per_root_pct]), mark:"%/root"}
  ], {H:150, ymin:0, xlabel:"day of era", ylabel:"% CPU per resident root", xname:"day", yname:"%"}) : "";

  const brows = bw.rows || [];
  const eras = [...new Set(brows.map(r => r.era))];
  const bwSeries = eras.map((e, i) => ({lbl:e, c: i ? "var(--s3)" : "var(--s8)",
    pts: brows.filter(r => r.era === e).map((r, k) => [k, r.d_state]), area:true,
    mark: e}));

  const ag = lt._age_grain || {}, ig = lt._instance_grain || {};
  const auDaily = (au.daily||[]);
  const auSeries = auDaily.length ? [
    {lbl:"tree-level", c:"var(--s1)", pts: auDaily.map((r,i) => [i+1, r.tree_level]), area:true, mark:"tree"},
    {lbl:"root-only", c:"var(--sg)", pts: auDaily.map((r,i) => [i+1, r.root_only]), mark:"root"}] : [];

  return `<div class="grid wide">
    ${panel("lifetime","How long an agent root lives",
      km.length ? lines(km, {H:210, xlog:true, ymin:0, ymax:1, xmin:0.02,
        xfmt: t => t < 1 ? (t*60).toFixed(0)+"m" : (t < 48 ? t.toFixed(0)+"h" : (t/24).toFixed(0)+"d"),
        yfmt: t => (100*t).toFixed(0)+"%", ylabel:"still alive", xlabel:"age since root start",
        xname:"age", yname:"S(t)"}) + legend(km.map(s => ({k:s.lbl, c:s.c}))) +
      `<div class="scroller"><table><tr><th>product</th><th>median</th><th>never exits</th>
        <th>born/host\u00b7h</th><th>died/host\u00b7h</th></tr>${prods.map(k => `<tr>
        <td class="mono">${esc(k)}</td><td class="num">${lt[k].median_h} h</td>
        <td class="num">${pc(lt[k].never_dies_pct)}</td>
        <td class="num">${lt[k].born_per_host_h}</td><td class="num">${lt[k].died_per_host_h}</td>
        </tr>`).join("")}</table></div>` : "")}
    ${panel("lifetime","Two grains disagree \u2014 on purpose",
      `<dl class="kv">
        <dt>agent roots</dt><dd>median ${ag.agent_roots ? ag.agent_roots.median_d : "\u2014"} d \u00b7
          p90 ${ag.agent_roots ? ag.agent_roots.p90_d : "\u2014"} d \u00b7
          ${ag.agent_roots ? pc(ag.agent_roots.over_1d_pct) : "\u2014"} older than a day</dd>

/* ================================================================== JOBS */
function tabJobs(){
  const j = P.jobs || {}, c = j.classes || {};
  if (!c.agent) return `<div class="panel"></div>`;
  const ag = c.agent, ot = c.other;
  const w = j.window || {};

  /* four grains, always */
  const grains = [
    {k:"jobs", k2:"array-expanded", f:"jobs"},
    {k:"submissions", k2:"arrays \u2192 1", f:"submissions"},
    {k:"users", k2:"per-capita", f:"users"},
    {k:"work_dirs", k2:"per-capita", f:"work_dirs"},
  ];
  const grainTable = `<div class="scroller"><table>
    <tr><th>unit</th><th>agent-attributed</th><th>everything else</th><th>agent share</th></tr>
    ${grains.map(g => {
      const a = ag[g.f], o = ot[g.f], s = 100*a/((a+o)||1);
      return `<tr><td>${esc(g.k)} <span style="color:var(--muted)">${esc(g.k2)}</span></td>
        <td class="num">${fint(a)}</td><td class="num">${fint(o)}</td>
        <td class="num">${s < 0.1 ? s.toFixed(3)+"%" : pc(s)}</td></tr>`;
    }).join("")}
    <tr><td>core-hours</td><td class="num">${fint(ag.core_hours)}</td>
      <td class="num">${fint(ot.core_hours)}</td>
      <td class="num">${pc(100*ag.core_hours/((ag.core_hours+ot.core_hours)||1))}</td></tr>
    <tr><td>GPU-hours</td><td class="num">${fint(ag.gpu_hours)}</td>
      <td class="num">${fint(ot.gpu_hours)}</td>
      <td class="num">${pc(100*ag.gpu_hours/((ag.gpu_hours+ot.gpu_hours)||1))}</td></tr>
    <tr><td>array collapse factor</td><td class="num">${ag.array_collapse}\u00d7</td>
      <td class="num">${ot.array_collapse}\u00d7</td><td class="num"></td></tr>
  </table></div>`;

  /* outcomes */
  const stKeys = ["COMPLETED","FAILED","TIMEOUT","OUT_OF_MEMORY","CANCELLED","PREEMPTED","NODE_FAIL","REQUEUED"];
  const stCol = {"COMPLETED":"var(--s3)","FAILED":"var(--s8)","TIMEOUT":"var(--s4)",
    "OUT_OF_MEMORY":"var(--s2)","CANCELLED":"var(--s5)","PREEMPTED":"var(--s1)",
    "NODE_FAIL":"var(--s7)","REQUEUED":"var(--sg)"};
  const outcome = [["agent-attributed", ag],["everything else", ot]].map(([lbl, x]) =>
    `<div><div class="eyebrow" style="margin-bottom:4px">${esc(lbl)} \u00b7 ${fint(x.jobs)} jobs</div>
      ${stackRow(stKeys.map(k => ({k, v:x.state_pct[k]||0, c:stCol[k]})), {H:20})}</div>`).join("");

  /* efficiency: three separate one-axis charts */
  const effChart = (field, label, fmtv) => {
    const groups = ["p10","p25","p50","p75","p90"].map(q => ({k:q, v:{
      agent: (ag[field]||{})[q] || 0, other: (ot[field]||{})[q] || 0}}));
    return `<div class="eyebrow" style="margin:6px 0 2px">${esc(label)}</div>` +
      groupBars(groups, [{k:"agent", lbl:"agent-attributed", c:"var(--s1)"},
                         {k:"other", lbl:"everything else", c:"var(--sg)"}],
        {H:150, maxBar:22, fmt: fmtv, tickFmt: t => (100*t).toFixed(0)+"%"});
  };

  /* gpu class */
  const gcKeys = ["gpu_used","gpu_idle","gpu_util_unknown","gpu_requested_unmet"];
  const gcCol = {"gpu_used":"var(--s3)","gpu_idle":"var(--s8)","gpu_util_unknown":"var(--sg)",
                 "gpu_requested_unmet":"var(--s4)"};
  const gpuRows = [["agent-attributed", ag],["everything else", ot]].map(([lbl, x]) => {
    const tot = Object.values(x.gpu_class||{}).reduce((a,b)=>a+b,0);
    return `<div><div class="eyebrow" style="margin-bottom:4px">${esc(lbl)} \u00b7 ${fint(tot)} GPU jobs</div>
      ${stackRow(gcKeys.map(k => ({k, v:(x.gpu_class||{})[k]||0, c:gcCol[k]})), {H:20})}</div>`;
  }).join("");

  /* submit timeline */
  const tl = (j.timeline||[]).filter(r => r.t >= "2026-05-30");
  const tlSeries = tl.length ? [
    {lbl:"all submissions", c:"var(--sg)", area:true, pts: tl.map((r,i) => [i, r.other])},
    {lbl:"agent-attributed", c:"var(--s1)", pts: tl.map((r,i) => [i, r.agent]), mark:"agent"}] : [];

  const retry = (j.retry_repeats||[]).map(r =>
    `<tr><td class="mono">${esc(r.user)}</td><td class="mono">${esc(r.product)}</td>
      <td class="num">${r.n}\u00d7</td><td><span class="cmd">${esc(r.submit_line)}</span></td></tr>`).join("");

  const parts = (j.partitions||[]).slice(0,12).map(([k,v]) => ({k, v, c:"var(--crimson)"}));
  const domRows = (ag.top_domains||[]).map(([d,n]) =>
    `<tr><td>${esc(d)}</td><td class="num">${fint(n)}</td></tr>`).join("");

  return `<div class="status" style="margin:-4px 0 16px">
    <span class="eyebrow">agent attribution</span>
    <span>path markers in <code>WorkDir</code> / <code>SubmitLine</code></span>
    <span><b>${fint(ag.jobs)}</b> jobs</span>
    <span><b>${fint(ag.submissions)}</b> submissions</span>
    <span><b>${fint(ag.users)}</b> users</span>
    <span><b>${fint(ag.work_dirs)}</b> work_dirs</span>
  </div>
  <div class="grid wide">
    ${panel("jobs","Footprint at four grains", grainTable +
      ``, {span:true})}
    ${panel("jobs","How the jobs ended", outcome + legend(stKeys.map(k => ({k, c:stCol[k]}))) +
      ``, {why:false})}
    ${panel("jobs","Did the allocation get used",
      effChart("cpu_eff","CPU efficiency \u2014 TotalCPU \u00f7 (cores \u00d7 elapsed)", v => pc(100*v)) +
      effChart("walltime_used_frac","Walltime used \u00f7 requested", v => pc(100*v)) +
      effChart("mem_eff","Peak RSS \u00f7 requested memory", v => pc(100*v)) +
      legend([{k:"agent-attributed", c:"var(--s1)"},{k:"everything else", c:"var(--sg)"}]) +
      ``, {why:false})}
    ${panel("jobs","GPU: granted vs actually driven", gpuRows +
      legend(gcKeys.map(k => ({k, c:gcCol[k]}))) +
      ``, {why:false})}
    ${panel("jobs","Submission cadence",
      tlSeries.length ? lines(tlSeries, {H:170, ymin:0,
        xticks: tl.map((r,i)=>i).filter(i => tl[i].t.endsWith("00") && i%12===0),
        xfmt: i => (tl[i] ? tl[i].t.slice(5).replace("T"," ")+"h" : ""),
        ylabel:"submissions per hour", xlabel:"submit hour", xname:"hour", yname:"jobs"}) +
        legend(tlSeries.map(s => ({k:s.lbl, c:s.c}))) : "", {why:false})}
    ${panel("jobs","Re-submitted identical command lines",
      `<div class="scroller"><table><tr><th>user</th><th>product</th><th>n</th><th>submit line</th></tr>
        ${retry || "<tr><td colspan=4>none</td></tr>"}</table></div>
       `, {why:false, span:true})}
    ${panel("jobs","Where the work ran",
      hbars(parts, {labelW:120, valW:60, unit:"jobs"}) +
      `<div class="eyebrow" style="margin-top:8px">agent-attributed science domains</div>
       <div class="scroller"><table>${domRows}</table></div>`, {why:false})}
  </div>`;
}

/* ================================================================== RISK */
function tabRisk(){
  const dg = P.dangerous || {}, lc = P.login_compute || {}, tp = P.tcp_providers || {};

  const dgRows = cat.map(r =>
    `<tr><td><span class="cmd">${esc(r.command)}</span></td>
      <td><span class="sev ${esc(r.severity)}">${esc(r.severity)}</span></td>

      <td class="num">${r.users}</td>

    lbl: fint(r.conns)+" conns", tip:`${r.provider}: ${fint(r.conns)} connections, ${fmt(r.tx_mb)} MB out / ${fmt(r.rx_mb)} MB in`}));
  const tpBytes = (tp.rows||[]).map(r => ({k:r.provider, v:r.tx_mb + r.rx_mb, c:"var(--s3)",

        ${dgRows}</table></div>

    ${panel("login_compute","Compute smuggled onto login nodes",
      hbars(lcRows, {labelW:150, valW:86}) +
      ``)}
    ${panel("tcp_providers","Where the bytes go",
      `<div class="eyebrow">connections closed</div>${hbars(tpRows, {labelW:100, valW:92})}
       <div class="eyebrow" style="margin-top:8px">bytes moved (tx + rx)</div>
       ${hbars(tpBytes, {labelW:100, valW:92})}
       `)}
    ${panel("scheduler","What the agents do to slurmctld",
      `<dl class="kv">
        <dt>RPC rate</dt><dd>${sc.rpc_s} calls/s</dd>
        <dt>polling share</dt><dd>${pc(sc.poll_pct)} \u00b7 partition-info alone ${pc(sc.partition_info_pct)}</dd>
        <dt>agent submits</dt><dd>${fint(sc.agent_submits)} \u00b7 ${fint(sc.agent_cancels)} cancels \u00b7
          peak ${fint(sc.peak_agent_submits_h)}/h</dd>
        <dt>polls per submit</dt><dd>agent ${pps.agent} vs human ${pps.human}</dd>
      </dl>
      <div class="eyebrow" style="margin-top:6px">who issues the calls</div>
      ${attSegs.length ? stackRow(attSegs, {H:20}) + legend(attSegs.map(s => ({k:s.k, c:s.c}))) : ""}
      `)}
    ${panel("gpu_duty","GPU: hours held vs how hard the device ran",
      `<div class="eyebrow">GPU-hours held</div>
       ${hbars(gClasses.map(c => ({k:CLS_LBL[c]||c, v:gh[c], c:CLS_COL[c]||"var(--sg)"})), {W:1040, labelW:150, valW:70})}

       ${hbars(gClasses.filter(c=>su[c]!=null).map(c => ({k:CLS_LBL[c]||c, v:su[c], c:CLS_COL[c]||"var(--sg)",

/* ================================================================== shell */
const TABS = [
  {k:"live", t:"Live", e:"right now \u00b7 all tiers",
   f:tabLive, cls:true},
  {k:"overview", t:"Agent Behaviour Console", e:"overview",
   f:tabOverview, cls:true},
  {k:"sessions", t:"Sessions & process mix", e:"process tier \u00b7 eBPF exit",
   f:tabSessions, cls:true},
  {k:"residency", t:"Residency & lifetime", e:"process tier \u00b7 eBPF residency",
   f:tabResidency},
  {k:"jobs", t:"Jobs & allocations", e:"accounting tier \u00b7 sacct",
   f:tabJobs},
  {k:"risk", t:"Risk & externalities", e:"cross-tier",
   f:tabRisk},
  {k:"feeds", t:"Feeds", e:"collector health",
   f:tabFeeds},
];

function render(){
  renderNav();
  renderBody();
}

function renderNav(){
  const tab = TABS.find(t => t.k === state.tab) || TABS[0];
  document.getElementById("tabtitle").textContent = tab.t;
  document.getElementById("tabeyebrow").textContent = tab.e;
  const nav = document.getElementById("nav");
  nav.innerHTML = TABS.map(t => {
    const n = Object.keys(P).filter(k => true).length;
    return `<button role="tab" aria-selected="${t.k===state.tab}" data-tab="${t.k}">
      <span>${esc(t.t.split(" &")[0].replace("Agent Behaviour Console","Overview"))}</span>
      <span class="n">${t.k === "live" ? '<i class="dot" style="background:var(--live);border-radius:50%"></i>' : (t.k===state.tab ? "\u25cf" : "")}</span></button>`;
  }).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.tab = b.dataset.tab; render(); window.scrollTo({top:0});
  });
}

function renderBody(){
  const tab = TABS.find(t => t.k === state.tab) || TABS[0];
  const filters = tab.cls ? `<div class="filters"><span class="eyebrow">class</span>` +
    CLS.map(c => `<button class="chip" data-cls="${c}" aria-pressed="${state.cls.has(c)}">
      <span class="sw" style="background:${CLS_COL[c]}"></span>${esc(CLS_LBL[c])}</button>`).join("") +
    `</div>` : "";
  const keep = document.querySelector(".stream");
  const keepTop = keep ? keep.scrollTop : 0;
  document.getElementById("body").innerHTML = filters + tab.f();
  const back = document.querySelector(".stream");
  if (back && keepTop) back.scrollTop = keepTop;
  document.querySelectorAll(".chip[data-cls]").forEach(b => b.onclick = () => {
    const c = b.dataset.cls;
    if (state.cls.has(c)) { if (state.cls.size > 1) state.cls.delete(c); }
    else state.cls.add(c);
    render();
  });

  paintStatus();
}

/* tooltip */
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el){ tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip;
  tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 13, y = e.clientY + 13;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 10;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 10;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("mouseleave", () => tip.style.opacity = 0);


/* ============================================================ live runtime */
let lastRead = Date.now();
let nextPoll = (DATA.refresh_s || 60) * 1000;
const agoStr = ms => ms < 1000 ? "just now"
  : ms < 60000 ? Math.round(ms/1000)+" s ago"
  : Math.round(ms/60000)+" min ago";

function paintStatus(){
  const L = DATA.live || {}, n = L.now || {};
  const age = Date.now() - lastRead;
  const stale = age > (DATA.refresh_s || 60) * 3000;
  const el = document.getElementById("provlegend");
  if (el) el.innerHTML =
    `<span class="pill ${stale ? "stale" : ""}"><i class="ld"></i>${stale ? "stale" : "live"}</span>
     <span>read <b>${esc(agoStr(age))}</b></span>
     <span>${esc((L.updated||DATA.built_at||"").slice(11) || "")}</span>
     <span>${fint((L.hosts||[]).length)} login nodes \u00b7 <b>${fint(n.exits_per_min)}</b> exits/min</span>
     <button class="refresh" id="refreshnow">refresh</button>`;
  const btn = document.getElementById("refreshnow");
  if (btn) btn.onclick = () => poll(true);
  const foot = document.getElementById("railfoot");
  if (foot) foot.innerHTML =
    `process tier \u00b7 event + 60 s<br>scheduler \u00b7 300 s<br>accounting \u00b7 daily<br>
     <span style="color:var(--ink-2)">read ${esc(agoStr(age))}</span>`;
}

/* advance the live tier between reads, the way a streaming panel does */
let evCursor = 0;
function tick(){
  const L = DATA.live;
  if (L){
    const pool = L.events || [];
    const add = 1 + Math.floor(Math.random() * 3);
    const fresh = [];
    for (let i = 0; i < add && pool.length; i++){
      const src = pool[(evCursor++) % pool.length];
      fresh.push(Object.assign({}, src, {ts: new Date().toTimeString().slice(0, 8)}));
    }
    L.events = fresh.concat(pool).slice(0, 400);
    state.freshCount = fresh.length;
    /* a new minute sample, mean-reverting around the last one */
    if (!tick.k || tick.k % 7 === 0){
      const r = L.rate;
      if (r && r.length){
        const prev = r[r.length-1], row = {t: new Date().toTimeString().slice(0,5)};
        CLS.forEach(c => {
          const base = prev[c] || 1;
          row[c] = Math.max(1, Math.round(base + base * (Math.random()-0.5) * 0.22
                    + (c === "agent" && Math.random() < 0.07 ? base * 1.1 : 0)));
        });
        r.push(row); r.shift();
        L.now.exits_per_min = CLS.reduce((a,c) => a + (row[c]||0), 0);
        L.now.exits_per_min_agent = row.agent;
        L.now.agent_roots += Math.round((Math.random()-0.42) * 6);
        L.now.running_agent_jobs += Math.round((Math.random()-0.5) * 9);
      }
    }
    tick.k = (tick.k || 0) + 1;
  }
  if (state.tab === "live") renderBody();
  paintStatus();
}

/* re-read the bundle the builder writes; harmless when the page is opened standalone */
async function poll(manual){
  try {
    const r = await fetch("data.json", {cache: "no-store"});
    if (!r.ok) throw 0;
    const j = await r.json();
    if (j && j.built_at && j.built_at !== DATA.built_at){
      DATA = j; P = DATA.panels; lastRead = Date.now(); render(); return;
    }
    if (manual) { lastRead = Date.now(); paintStatus(); }
  } catch (e) {
    /* standalone copy: the inlined bundle is all there is */
    if (manual) { lastRead = Date.now(); paintStatus(); }
  }
}

render();
setInterval(tick, 3000);
setInterval(() => poll(false), nextPoll);
</script>
