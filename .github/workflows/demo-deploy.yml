name: demo-deploy

# Deploys the public demo (deploy/cloudflare: a Worker in front of one Cloudflare
# Container running `rc_dashboard demo`) whenever develop changes what the demo
# runs. It is the same `wrangler deploy` deploy/cloudflare/README.md runs by
# hand: wrangler builds docker/demo/Dockerfile with the runner's Docker, pushes
# the image to Cloudflare's registry, and deploys the Worker and the container.
#
# develop, not main: the demo is develop's page (the other workflows build
# nothing from develop because they publish release images; this publishes only
# the demo, which is meant to show the newest page).
#
# Needs two secrets from the Cloudflare account that holds the agentic-system.org
# zone, set on the `demo` environment (Settings -> Environments -> demo) with
# its deployment branches limited to develop, so no other branch or workflow
# can read a token that edits that account's Workers and Containers:
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template,
#                          with Account -> Containers -> Edit added
#   CLOUDFLARE_ACCOUNT_ID  that account's ID
# See deploy/cloudflare/README.md, "Deploying from GitHub".

on:
  push:
    branches: ["develop"]
    # Only what goes into the image (docker/demo/Dockerfile.dockerignore) or
    # into the Worker: a change to the collector or a test does not redeploy.
    paths:
      - "dashboard/pyproject.toml"
      - "dashboard/uv.lock"
      - "dashboard/rc_dashboard/**"
      - "dashboard/web/**"
      - "docker/demo/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/demo-deploy.yml"
  # A redeploy by hand, from the Actions tab: after rotating the token, after a
  # security fix to a base image (they are tags, so a rebuilt one reaches the
  # demo only at the next deploy), or to put the demo back after a
  # `wrangler delete`. Only develop deploys (the job's `if`); run from any other
  # branch, the job is skipped.
  workflow_dispatch:

# One deploy at a time, and never cut one short: a deploy is not transactional
# (the new Worker can be live before its image has rolled out). A push while a
# deploy runs waits for it; GitHub keeps one waiting run per group, so a later
# push replaces the waiting one, which then shows as cancelled. The newest
# commit always deploys last.
concurrency:
  group: demo-deploy
  cancel-in-progress: false

# Nothing by default; the job asks for what it reads.
permissions: {}

jobs:
  deploy:
    # The public demo is develop's page: a run started by hand from another
    # branch does nothing. This is a convenience, not the security boundary: a
    # run by hand uses the workflow file of the branch it starts on, which can
    # drop this line. The `demo` environment's develop-only branch rule is what
    # keeps the token from any other branch, and must exist before the secrets.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: demo
      url: https://hpc-dashboard.agentic-system.org
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::the demo was not deployed: secret(s)$missing not set on the demo environment. See deploy/cloudflare/README.md, \"Deploying from GitHub\"."
            exit 1
          fi

      # Actions pinned to a commit, not a tag, since the deploy token is in this job.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # nothing here pushes, so leave no GitHub token in .git/config for
          # later steps (npm's install scripts among them) to read
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      # wrangler is pinned in deploy/cloudflare/package.json, so CI deploys with
      # the same version a deploy by hand does.
      - name: Install wrangler
        run: npm ci --no-audit --no-fund

      # wrangler bundles the Worker with esbuild, which strips types without
      # checking them: a type error stops here, before it is live.
      - name: Type-check the Worker
        run: npm run typecheck

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Summary
        if: success()
        working-directory: .
        run: |
          {
            echo "### Demo deployed"
            echo
            echo "\`${GITHUB_SHA::7}\` from \`${GITHUB_REF_NAME}\` is deploying to <https://hpc-dashboard.agentic-system.org>."
            echo "The container rolls out over the next few minutes; until it is up the page says the demo is starting."
          } >> "$GITHUB_STEP_SUMMARY"
