name: base-image

# Builds the Rocky 8.10 base image and pushes it to the GitHub Container
# Registry. The collector image (collector-image.yml) builds FROM this.
#
# Tagging strategy (shared with the collector + rpm workflows):
#   * semver git tag  v1.2.3  -> 1.2.3, 1.2, latest   (releases)
#   * branch push             -> <branch-slug>, <branch-slug>-<YYYYMMDD>-<sha>
#   * main branch             -> additionally `edge`
# Datestamped tags give a branch build an immutable handle; the moving
# branch-slug tag always points at that branch's newest build.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths:
      - "docker/base/**"
      - ".github/workflows/base-image.yml"
  # Allow a manual rebuild (e.g. to pick up upstream Rocky updates) without a
  # code change.
  workflow_dispatch:

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value={{branch}}-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.ref_type == 'branch' }}
            type=edge,branch=main
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/base
          file: docker/base/Dockerfile.rocky810
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
