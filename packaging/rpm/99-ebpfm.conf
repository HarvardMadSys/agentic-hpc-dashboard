# Required by the ebpfm collector's eBPF tier.
#
# Without these two, two of the eight data points the collector adds are inert:
# uninterruptible-sleep (D-state) stall time and the blkio/swapin dwell fields
# read 0 rather than absent -- the worst failure mode for a measurement tool.
#
# Installed by the ebpfm-collector RPM and applied by systemd-sysctl on boot;
# the RPM's %post also applies it immediately so no reboot is required. These
# knobs are not namespaced, so a containerized collector still needs them set
# on the host.
#
# task_delayacct uses systemd's leading-dash form: on EL8's 4.18 kernel the
# feature is compiled in (CONFIG_TASK_DELAY_ACCT=y) and ENABLED BY DEFAULT, but
# the *writable* sysctl /proc/sys/kernel/task_delayacct did not exist until
# kernel 5.14. On EL8 the key is therefore absent even though delay accounting
# is active; the dash tells systemd-sysctl to skip a missing key silently
# instead of logging "Couldn't write '1' to 'kernel/task_delayacct'". On 5.14+
# the key exists and is set normally. sched_schedstats has no dash: it DOES
# exist and is writable on EL8, and it genuinely needs to be 1.
kernel.sched_schedstats = 1
-kernel.task_delayacct = 1
